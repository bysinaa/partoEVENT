name: parto

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: parto-cms/apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_PORT: 3006
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      API_URL: https://${API_DOMAIN}
      ADMIN_URL: https://${ADMIN_DOMAIN}
      WEBSITE_URL: https://${SITE_DOMAIN}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_EDITOR_EMAIL: ${DEFAULT_EDITOR_EMAIL}
      DEFAULT_EDITOR_PASSWORD: ${DEFAULT_EDITOR_PASSWORD}
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: parto-cms/apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
    depends_on:
      api:
        condition: service_healthy

  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDIA_HOST: ${API_DOMAIN}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CMS_API_URL: http://api:3006/api/v1/api/public
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - admin
      - api

volumes:
  postgres_data:
  api_uploads:
  caddy_data:
  caddy_config:
